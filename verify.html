<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificación de cotización — Villa Don Tomás</title>
<style>
  :root{
    --ink:#0f1c3e;
    --brass:#325a96;
    --paper:#f2efe7;
    --line:#e3e0d6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 28px 16px;
  }
  .card{
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 40px -18px rgba(15,28,62,.35);
  }
  .head{
    background: linear-gradient(135deg, var(--ink), var(--brass));
    color: #fff;
    padding: 26px 22px;
    text-align: center;
  }
  .head h1{
    font-size: 18px;
    margin: 0 0 4px;
    letter-spacing: .02em;
  }
  .head p{
    margin: 0;
    font-size: 12.5px;
    opacity: .85;
  }
  .status{
    padding: 14px 22px;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    letter-spacing: .01em;
  }
  .status.ok{ background:#e7f3ec; color:#1c6b3a; }
  .status.bad{ background:#fbeceb; color:#a8462f; }
  table{ width:100%; border-collapse: collapse; font-size: 13.5px; }
  td{ padding: 12px 22px; border-bottom: 1px solid var(--line); }
  td.label{ color:#8a8574; width: 42%; font-size: 11.5px; text-transform: uppercase; letter-spacing:.04em; }
  td.value{ font-weight: 700; text-align: right; }
  .foot{ padding: 16px 22px; font-size: 11px; color:#8a8574; text-align:center; line-height:1.5; }

  /* Pantalla de clave */
  .lock-body{ padding: 26px 22px; }
  .lock-body label{
    display:block; font-size:11.5px; color:#8a8574; text-transform:uppercase;
    letter-spacing:.05em; margin-bottom:8px; font-weight:600;
  }
  .lock-body input{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:6px;
    font-size:16px; margin-bottom:12px; box-sizing:border-box; letter-spacing:.15em; text-align:center;
  }
  .lock-body input:focus{ outline:2px solid var(--brass); border-color:var(--brass); }
  .lock-btn{
    width:100%; padding:13px; background:var(--ink); color:#fff; border:none;
    border-radius:6px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .lock-btn:hover{ background:#0a1530; }
  .lock-error{
    color:#a8462f; font-size:12.5px; margin-top:10px; text-align:center; display:none; font-weight:600;
  }
  .lock-icon{ text-align:center; font-size:32px; margin-bottom:6px; }
</style>
</head>
<body>

  <!-- Pantalla de clave -->
  <div class="card" id="lockCard">
    <div class="head">
      <h1>Apart Hotel Villa Don Tomás</h1>
      <p>Verificación de cotización</p>
    </div>
    <div class="lock-body">
      <div class="lock-icon">🔒</div>
      <label for="pinInput">Ingresá la clave de acceso</label>
      <input id="pinInput" type="password" inputmode="text" placeholder="••••••" autocomplete="off">
      <button class="lock-btn" onclick="checkPin()">Ver verificación</button>
      <div class="lock-error" id="pinError">Clave incorrecta. Probá de nuevo.</div>
    </div>
  </div>

  <!-- Resultado (oculto hasta ingresar la clave) -->
  <div class="card" id="resultCard" style="display:none;">
    <div class="head">
      <h1>Apart Hotel Villa Don Tomás</h1>
      <p>Verificación de cotización</p>
    </div>
    <div id="content"></div>
  </div>

<script>
// IMPORTANTE: esta clave tiene que ser EXACTAMENTE la misma que la variable
// SECRET_KEY del archivo cotizador-hotelero.html. Si cambiás una, cambiá la otra.
const SECRET_KEY = 'VillaDonTomas-Dani';

// Clave de acceso para poder VER el resultado de la verificación.
// Cambiala por la que quieras vos (no tiene que coincidir con SECRET_KEY).
const ACCESS_PIN = 'DonTomas2026';

function fnv1aHash(str){
  let hash = 0x811c9dc5;
  for (let i = 0; i < str.length; i++){
    hash ^= str.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193);
  }
  return (hash >>> 0).toString(16).toUpperCase().padStart(8, '0');
}

function fmtDate(iso){
  if(!iso) return '—';
  const parts = iso.split('-');
  return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : iso;
}

function checkPin(){
  const val = document.getElementById('pinInput').value;
  const errorEl = document.getElementById('pinError');
  if (val === ACCESS_PIN) {
    document.getElementById('lockCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'block';
    sessionStorage.setItem('vdt_verify_unlocked', '1');
    runVerification();
  } else {
    errorEl.style.display = 'block';
    document.getElementById('pinInput').value = '';
    document.getElementById('pinInput').focus();
  }
}

document.getElementById('pinInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') checkPin();
});

function runVerification(){
  const params = new URLSearchParams(window.location.search);
  const cot = params.get('cot') || '';
  const checkin = params.get('checkin') || '';
  const checkout = params.get('checkout') || '';
  const personas = params.get('personas') || '';
  const total = params.get('total') || '';
  const b = params.get('b') || '';
  const hashFromUrl = (params.get('h') || '').toUpperCase();

  const content = document.getElementById('content');

  if (!cot || !hashFromUrl) {
    content.innerHTML = `
      <div class="status bad">✕ Código incompleto</div>
      <div class="foot">Este enlace no tiene toda la información necesaria para verificar la cotización. Escaneá el QR directamente desde el PDF.</div>
    `;
    return;
  }

  const raw = `${cot}|${checkin}|${checkout}|${personas}|${Number(total).toFixed(2)}|${b}|${SECRET_KEY}`;
  const expectedHash = fnv1aHash(raw);
  const isValid = expectedHash === hashFromUrl;

  if (isValid) {
    // Desglose de presupuestos (si hay más de uno): "Presupuesto 1:345.00,Presupuesto 2:512.50"
    let budgetsHtml = '';
    if (b) {
      const rows = b.split(',').map(item => {
        const idx = item.lastIndexOf(':');
        if (idx === -1) return null;
        const label = item.slice(0, idx);
        const amount = item.slice(idx + 1);
        return `<tr><td class="label">${label}</td><td class="value">USD ${amount}</td></tr>`;
      }).filter(Boolean);
      if (rows.length > 1) {
        budgetsHtml = rows.join('');
      }
    }

    content.innerHTML = `
      <div class="status ok">✓ Cotización válida</div>
      <table>
        <tr><td class="label">N° de cotización</td><td class="value">${cot}</td></tr>
        <tr><td class="label">Check-in</td><td class="value">${fmtDate(checkin)}</td></tr>
        <tr><td class="label">Check-out</td><td class="value">${fmtDate(checkout)}</td></tr>
        <tr><td class="label">Personas</td><td class="value">${personas || '—'}</td></tr>
        ${budgetsHtml}
        <tr><td class="label">Total ${budgetsHtml ? '(todas las alternativas)' : ''}</td><td class="value">USD ${total || '—'}</td></tr>
      </table>
      <div class="foot">
        Estos datos coinciden exactamente con los que emitió el hotel para esta cotización.
        Si el PDF impreso muestra un total, fechas o cantidad de personas distintos a los de aquí, puede haber sido alterado.
      </div>
    `;
  } else {
    content.innerHTML = `
      <div class="status bad">✕ No coincide</div>
      <div class="foot">
        Los datos de este código no coinciden con lo emitido por el hotel. El PDF puede haber sido
        modificado después de generarse. Comunicate con el hotel para confirmar los valores correctos
        de la cotización <b>${cot}</b>.
      </div>
    `;
  }
}

// Si ya se desbloqueó antes en esta misma sesión del navegador, no pide la clave de nuevo.
if (sessionStorage.getItem('vdt_verify_unlocked') === '1') {
  document.getElementById('lockCard').style.display = 'none';
  document.getElementById('resultCard').style.display = 'block';
  runVerification();
}
</script>
</body>
</html>
